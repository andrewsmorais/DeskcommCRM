impacto: capacidade_nova
secao: alterado
titulo: Comece o agente pelo objetivo e acompanhe seu plano na configuração
---

A criação de um agente passa a oferecer pontos de partida para atendimento,
vendas, suporte e agendamento, mantendo o editor completo e a revisão das
capacidades. Funis e materiais já cadastrados ficam disponíveis durante a
criação. O ensaio inicial reconhece a resposta do agente e mostra os motivos
que impedem o teste. O plano contratado é recuperado pela organização da
conta e apresentado durante a configuração, com indicação de falha de
consulta quando não é possível confirmá-lo. Não há ação manual de atualização
do banco nesta entrega.
